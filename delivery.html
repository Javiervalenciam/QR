    <script>
      window.APP_INITIAL_CODE = <?!= JSON.stringify(initialCode || '') ?>;

    <script>
      var branding = normalizeBranding(window.APP_BRANDING || {});
      var currentCoupon = null;

      function $(id) { return document.getElementById(id); }

      function showSearchError(msg) {
        $('searchError').innerHTML = msg
          ? '<div class="notice error">' + escapeHtml(msg) + '</div>'
          : '';
      }

      // ---- Marca ----
      function renderBrand() {
        var src = branding.logoUrl || branding.logoDataUri || '';
        var name = escapeHtml(branding.businessName || 'Dulce Mezcla');
        var el = $('deliveryBrand');
        if (!el) return;
        el.innerHTML = src
          ? '<img class="brand-logo tiny" src="' + escapeHtml(src) + '" alt="' + name + '">'
          : '<div class="brand-logo tiny text-logo" aria-label="' + name + '">DM</div>';
      }

      // ---- Consultar cupón ----
      function consultCoupon() {
        var pin = ($('pinInput').value || '').trim();
        var code = ($('codeInput').value || '').trim().toUpperCase();
        showSearchError('');
        if (!pin) { showSearchError('Ingresa el PIN_ADMIN.'); return; }
        if (!code) { showSearchError('Ingresa o pega el código del cupón.'); return; }

        var btn = $('consultButton');
        btn.disabled = true;
        btn.textContent = 'Consultando…';
        $('resultArea').classList.add('hidden');

        callServer('getCouponForDelivery', code, pin)
          .then(function (result) {
            btn.disabled = false;
            btn.textContent = 'Consultar cupón';
            if (!result.ok) { showSearchError(result.message || 'No se pudo consultar.'); return; }
            currentCoupon = result.coupon;
            renderResult(result.coupon);
          })
          .catch(function (err) {
            btn.disabled = false;
            btn.textContent = 'Consultar cupón';
            showSearchError(err && err.message ? err.message : String(err));
          });
      }

      // ---- Render del resultado por CASO ----
      function renderResult(coupon) {
        var state = String(coupon.estado || '').toUpperCase();
        var delivery = String(coupon.entrega_estado || '').toUpperCase();
        var area = $('resultArea');

        var banner = '';
        var action = '';

        if (state === 'ELIMINADO') {
          banner = bannerHtml('bad', 'Cupón eliminado', 'Este cupón fue eliminado y no se puede entregar.');
        } else if (state === 'ANULADO') {
          banner = bannerHtml('bad', 'Cupón anulado', 'Este cupón está anulado y no se puede entregar.');
        } else if (state === 'DISPONIBLE') {
          banner = bannerHtml('warn', 'Aún no redimido', 'El cliente todavía no ha redimido este cupón. No se puede entregar.');
        } else if (state === 'REDIMIDO' && delivery === 'ENTREGADO') {
          banner = bannerHtml('bad', 'Ya fue entregado', 'Este cupón ya fue entregado el ' + escapeHtml(coupon.fecha_entrega || '-') + '.');
        } else if (state === 'REDIMIDO') {
          banner = bannerHtml('ok', 'Listo para entregar', 'Cupón redimido y pendiente de entrega.');
          action = deliveryFormHtml();
        } else {
          banner = bannerHtml('warn', 'Estado no reconocido', 'Revisa el cupón en el panel admin.');
        }

        area.innerHTML =
          banner +
          '<section class="delivery-card">' +
            '<div class="code-big">' + escapeHtml(coupon.codigo) + '</div>' +
            '<div class="info-grid">' +
              infoRow('Promoción', coupon.promocion || '-') +
              infoRow('Estado', stateBadge(coupon.estado)) +
              infoRow('Entrega', deliveryBadge(coupon)) +
              infoRow('Redimido', coupon.fecha_redencion || '—') +
              (delivery === 'ENTREGADO' ? infoRow('Entregado', coupon.fecha_entrega || '—') : '') +
              (delivery === 'ENTREGADO' && coupon.entregado_por ? infoRow('Por', coupon.entregado_por) : '') +
              (delivery === 'ENTREGADO' && coupon.comentario_entrega ? infoRow('Nota', coupon.comentario_entrega) : '') +
            '</div>' +
            action +
            '<div id="deliveryResult" class="inline-result"></div>' +
            '<div class="button-stack" style="margin-top:14px;">' +
              '<button class="big-button ghost" type="button" id="newQueryButton">Consultar otro cupón</button>' +
            '</div>' +
          '</section>';

        area.classList.remove('hidden');
        area.scrollIntoView({ behavior: 'smooth', block: 'start' });

        var confirmBtn = $('confirmDeliveryButton');
        if (confirmBtn) confirmBtn.addEventListener('click', confirmDelivery);
        $('newQueryButton').addEventListener('click', resetToSearch);
      }

      function deliveryFormHtml() {
        return '' +
          '<div style="margin-top:8px;">' +
            '<label class="delivery-field">Entregado por' +
              '<input id="entregadoPor" type="text" value="Stand" maxlength="60">' +
            '</label>' +
            '<label class="delivery-field">Comentario (opcional)' +
              '<input id="comentarioEntrega" type="text" placeholder="Ej. Detalle entregado" maxlength="120">' +
            '</label>' +
            '<button class="big-button success" type="button" id="confirmDeliveryButton">Confirmar entrega</button>' +
          '</div>';
      }

      function confirmDelivery() {
        var pin = ($('pinInput').value || '').trim();
        var btn = $('confirmDeliveryButton');
        var box = $('deliveryResult');
        btn.disabled = true;
        box.innerHTML = '<div class="notice">Confirmando entrega…</div>';

        var payload = {
          pin: pin,
          codigo: currentCoupon.codigo,
          entregado_por: ($('entregadoPor') && $('entregadoPor').value) || 'Stand',
          comentario_entrega: ($('comentarioEntrega') && $('comentarioEntrega').value) || ''
        };

        callServer('markCouponDelivered', payload)
          .then(function (result) {
            if (!result.ok) {
              btn.disabled = false;
              box.innerHTML = '<div class="notice error">' + escapeHtml(result.message) + '</div>';
              if (result.coupon) { currentCoupon = result.coupon; renderResult(result.coupon); }
              return;
            }
            currentCoupon = result.coupon;
            // Re-render: ahora mostrará "Ya fue entregado" y bloquea el botón.
            renderResult(result.coupon);
            $('deliveryResult').innerHTML = '<div class="notice success">✓ Entrega confirmada correctamente.</div>';
          })
          .catch(function (err) {
            btn.disabled = false;
            box.innerHTML = '<div class="notice error">' + escapeHtml(err && err.message ? err.message : String(err)) + '</div>';
          });
      }

      function resetToSearch() {
        currentCoupon = null;
        $('resultArea').classList.add('hidden');
        $('resultArea').innerHTML = '';
        $('codeInput').value = '';
        $('codeInput').focus();
        $('searchCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      // ---- Helpers de render ----
      function bannerHtml(tone, title, body) {
        return '<div class="status-banner ' + tone + '"><h2>' + escapeHtml(title) + '</h2><p>' + escapeHtml(body) + '</p></div>';
      }
      function infoRow(label, valueHtml) {
        return '<div class="info-row"><span>' + escapeHtml(label) + '</span><strong>' + valueHtml + '</strong></div>';
      }
      function deliveryBadge(coupon) {
        if (String(coupon.estado || '').toUpperCase() !== 'REDIMIDO') return '<span class="delivery-badge">—</span>';
        var delivered = String(coupon.entrega_estado || '').toUpperCase() === 'ENTREGADO';
        return delivered
          ? '<span class="delivery-badge entregado">ENTREGADO</span>'
          : '<span class="delivery-badge pendiente">PENDIENTE</span>';
      }
      // stateBadge viene de shared.html, pero acepta HTML escapado de forma segura.

      // ---- Pegar código ----
      function pasteCode() {
        if (navigator.clipboard && navigator.clipboard.readText) {
          navigator.clipboard.readText()
            .then(function (text) {
              $('codeInput').value = extractCode(text);
              $('codeInput').focus();
            })
            .catch(function () { $('codeInput').focus(); });
        } else {
          var manual = window.prompt('Pega el código o el enlace del cupón:');
          if (manual) $('codeInput').value = extractCode(manual);
        }
      }

      // Si pegan un enlace completo (?code=DULCE-XXX) extrae solo el código.
      function extractCode(text) {
        text = String(text || '').trim();
        var m = text.match(/[?&]code=([^&\s]+)/i);
        if (m) { try { return decodeURIComponent(m[1]).toUpperCase(); } catch (e) { return m[1].toUpperCase(); } }
        return text.toUpperCase();
      }

      // ============================================================
      // Escáner QR (cámara en vivo + respaldo "tomar foto")
      // El QR de cada cupón codifica su URL de redención (…?code=DULCE-XXX),
      // así que reusamos extractCode() para obtener el código y luego pasa
      // EXACTAMENTE por el mismo flujo que el texto manual (consultCoupon()).
      // ============================================================
      var scanStream = null;       // MediaStream activo
      var scanRAF = null;          // id de requestAnimationFrame
      var scanActive = false;      // loop de escaneo en curso
      var scanDetector = null;     // BarcodeDetector nativo (si existe)
      var scanCanvas = null, scanCtx = null;
      var barcodeDetectorSupported = (typeof window.BarcodeDetector === 'function');

      function setScanHint(msg, isError) {
        var el = $('scannerHint');
        if (!el) return;
        el.textContent = msg;
        el.classList.toggle('error', !!isError);
      }

      // ¿El texto escaneado parece un cupón nuestro? (URL con ?code= o patrón PREFIX-XXXX)
      function looksLikeCoupon(raw, code) {
        return /[?&]code=/i.test(String(raw)) || /^[A-Z0-9]{2,}-[A-Z0-9]{4,}$/.test(String(code || ''));
      }

      function getScanCtx() {
        if (!scanCanvas) {
          scanCanvas = document.createElement('canvas');
          scanCtx = scanCanvas.getContext('2d', { willReadFrequently: true });
        }
        return scanCtx;
      }

      function openScanner() {
        showSearchError('');
        var pin = ($('pinInput').value || '').trim();
        if (!pin) { showSearchError('Ingresa el PIN_ADMIN antes de escanear.'); $('pinInput').focus(); return; }
        $('scannerOverlay').classList.remove('hidden');
        document.body.style.overflow = 'hidden';
        startCamera();
      }

      function startCamera() {
        setScanHint('Apunta la cámara al código QR…', false);
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          fallbackToPhoto('Tu navegador no permite cámara en vivo aquí. Usa "Tomar foto del QR".');
          return;
        }
        navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false })
          .then(function (stream) {
            scanStream = stream;
            var video = $('scannerVideo');
            video.srcObject = stream;
            return video.play();
          })
          .then(function () {
            scanActive = true;
            if (barcodeDetectorSupported) {
              try { scanDetector = new window.BarcodeDetector({ formats: ['qr_code'] }); }
              catch (e) { scanDetector = null; }
            }
            scanLoop();
          })
          .catch(function () {
            // Permiso denegado, sin cámara, o bloqueada por el iframe de Apps Script.
            fallbackToPhoto('No pudimos abrir la cámara en vivo. Toca "Tomar foto del QR".');
          });
      }

      function scanLoop() {
        if (!scanActive) return;
        var video = $('scannerVideo');
        if (video.readyState >= video.HAVE_ENOUGH_DATA && video.videoWidth) {
          if (scanDetector) {
            scanDetector.detect(video)
              .then(function (codes) {
                if (codes && codes.length) { onScanText(codes[0].rawValue); }
                else if (scanActive) { scanRAF = requestAnimationFrame(scanLoop); }
              })
              .catch(function () {
                // BarcodeDetector falló en runtime → degradar a jsQR.
                scanDetector = null;
                if (scanActive) scanRAF = requestAnimationFrame(scanLoop);
              });
            return;
          }
          var text = decodeFrameWithJsQR(video);
          if (text) { onScanText(text); return; }
        }
        scanRAF = requestAnimationFrame(scanLoop);
      }

      function decodeFrameWithJsQR(video) {
        if (typeof jsQR !== 'function') return null;
        var ctx = getScanCtx();
        var w = video.videoWidth, h = video.videoHeight;
        var maxDim = 640; // limita resolución por rendimiento
        var scale = Math.min(1, maxDim / Math.max(w, h));
        var cw = Math.round(w * scale), ch = Math.round(h * scale);
        scanCanvas.width = cw; scanCanvas.height = ch;
        ctx.drawImage(video, 0, 0, cw, ch);
        var img = ctx.getImageData(0, 0, cw, ch);
        var result = jsQR(img.data, cw, ch, { inversionAttempts: 'dontInvert' });
        return result && result.data ? result.data : null;
      }

      function onScanText(raw) {
        var code = extractCode(raw);
        if (!looksLikeCoupon(raw, code)) {
          setScanHint('Ese QR no parece un cupón. Apunta al QR del cliente…', true);
          if (scanActive) scanRAF = requestAnimationFrame(scanLoop);
          return;
        }
        if (navigator.vibrate) { try { navigator.vibrate(60); } catch (e) {} }
        closeScanner();
        $('codeInput').value = code;
        consultCoupon(); // mismo flujo que el ingreso manual
      }

      // Respaldo universal: input file con captura de cámara (funciona aunque
      // getUserMedia esté bloqueado por la política del iframe, p. ej. iOS).
      function fallbackToPhoto(msg) {
        scanActive = false;
        if (scanRAF) { cancelAnimationFrame(scanRAF); scanRAF = null; }
        setScanHint(msg, true);
      }

      function decodeImageFile(file) {
        if (typeof jsQR !== 'function') {
          setScanHint('No se pudo cargar el lector. Ingresa el código manualmente.', true);
          return;
        }
        setScanHint('Leyendo la foto…', false);
        var url = URL.createObjectURL(file);
        var img = new Image();
        img.onload = function () {
          var maxDim = 1024;
          var scale = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
          var cw = Math.round(img.naturalWidth * scale), ch = Math.round(img.naturalHeight * scale);
          var ctx = getScanCtx();
          scanCanvas.width = cw; scanCanvas.height = ch;
          ctx.drawImage(img, 0, 0, cw, ch);
          URL.revokeObjectURL(url);
          var data = ctx.getImageData(0, 0, cw, ch);
          var result = jsQR(data.data, cw, ch, { inversionAttempts: 'attemptBoth' });
          if (result && result.data) {
            var code = extractCode(result.data);
            if (looksLikeCoupon(result.data, code)) {
              if (navigator.vibrate) { try { navigator.vibrate(60); } catch (e) {} }
              closeScanner();
              $('codeInput').value = code;
              consultCoupon();
              return;
            }
          }
          setScanHint('No se detectó un QR de cupón en la foto. Acércate e intenta de nuevo.', true);
        };
        img.onerror = function () { URL.revokeObjectURL(url); setScanHint('No se pudo leer la imagen.', true); };
        img.src = url;
      }

      function closeScanner() {
        scanActive = false;
        if (scanRAF) { cancelAnimationFrame(scanRAF); scanRAF = null; }
        if (scanStream) {
          scanStream.getTracks().forEach(function (t) { t.stop(); });
          scanStream = null;
        }
        var video = $('scannerVideo');
        if (video) { try { video.pause(); } catch (e) {} video.srcObject = null; }
        scanDetector = null;
        $('scannerOverlay').classList.add('hidden');
        document.body.style.overflow = '';
      }

      // ---- Init ----
      // Reescribe el enlace a admin con la URL absoluta (evita userCodeAppPanel vacío).
      if (window.APP_WEB_APP_URL && $('adminLink')) {
        $('adminLink').setAttribute('href', window.APP_WEB_APP_URL + '?admin=1');
      }
      renderBrand();
      $('consultButton').addEventListener('click', consultCoupon);
      $('pasteButton').addEventListener('click', pasteCode);
      $('scanButton').addEventListener('click', openScanner);
      $('scannerClose').addEventListener('click', closeScanner);
      $('scannerPhotoBtn').addEventListener('click', function () { $('scannerFile').click(); });
      $('scannerFile').addEventListener('change', function (e) {
        var file = e.target.files && e.target.files[0];
        e.target.value = ''; // permite repetir la misma foto
        if (file) decodeImageFile(file);
      });
      $('codeInput').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); consultCoupon(); }
      });

      // Si llegó ?code= (ej. enlace ?delivery=1&code=DULCE-XXX), precargarlo.
      if (window.APP_INITIAL_CODE) {
        $('codeInput').value = String(window.APP_INITIAL_CODE).toUpperCase();
      }
    </script>
  </body>
</html>
