<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <?!= include('styles'); ?>
  </head>
  <body>
    <main class="page admin-page">
      <section class="brand-bar">
        <div>
          <p class="eyebrow">Panel administrativo</p>
          <h1>Cupones QR</h1>
        </div>
        <div class="admin-brand-mini" id="adminBrand"></div>
        <a class="ghost-link" id="deliveryLink" href="?delivery=1" target="_blank" rel="noopener">Modo entrega</a>
        <a class="ghost-link" id="printLink" href="?print=1" target="_blank" rel="noopener">Imprimir QR</a>
      </section>

      <section id="loginPanel" class="card">
        <h2>Acceso admin</h2>
        <!-- onsubmit return false: el Enter NUNCA dispara un submit HTML nativo
             (que en el sandbox de Apps Script navega a userCodeAppPanel y deja la
             pestaña en blanco). El botón es type="button" + onclick directo: el
             listener queda garantizado sin depender del orden de carga de scripts. -->
        <form id="loginForm" class="inline-form" onsubmit="loginAdmin(event); return false;">
          <input id="adminPin" type="password" inputmode="numeric" autocomplete="one-time-code" placeholder="PIN_ADMIN" required>
          <button id="loginButton" class="primary-button" type="button" onclick="loginAdmin(event)">Entrar</button>
        </form>
        <div id="loginError" class="inline-result"></div>
        <p class="muted">El PIN se valida en el servidor en cada acción.</p>
      </section>

      <section id="adminContent" class="hidden">
        <div id="summaryGrid" class="summary-grid"></div>

        <section class="card">
          <h2>Generar códigos</h2>
          <form id="generateForm" class="form-grid">
            <label>
              Cantidad
              <input id="quantity" type="number" min="1" max="1000" value="1">
            </label>
            <label>
              Prefijo
              <select id="prefix">
                <option value="DULCE">DULCE</option>
                <option value="MEZCLA">MEZCLA</option>
              </select>
            </label>
            <label>
              Promoción
              <input id="promotion" type="text" maxlength="120" value="Descuento especial">
            </label>
            <label class="wide">
              Descripción
              <textarea id="description" rows="2" maxlength="300" placeholder="Ej. 10% de descuento en tortas seleccionadas"></textarea>
            </label>
            <div class="button-row wide">
              <button class="secondary-button" type="button" data-batch="1">1 código</button>
              <button class="secondary-button" type="button" data-batch="100">100</button>
              <button class="secondary-button" type="button" data-batch="300">300</button>
              <button class="secondary-button" type="button" data-batch="500">500</button>
              <button class="secondary-button" type="button" data-batch="1000">1000</button>
              <button class="primary-button" type="submit">Generar lote</button>
            </div>
          </form>
          <div id="generateResult" class="inline-result"></div>
        </section>

        <section class="toolbar card">
          <div class="toolbar-head">
            <h2>Buscar cupón</h2>
            <span id="listCount" class="muted"></span>
          </div>
          <div class="search-block">
            <label class="search-field">
              Código
              <input id="searchBox" type="search" placeholder="DULCE-ABC123" autocomplete="off">
            </label>
            <label class="state-field">
              Estado
              <select id="stateFilter">
                <option value="">Todos</option>
                <option value="DISPONIBLE">Disponibles</option>
                <option value="REDIMIDO">Redimidos</option>
                <option value="ANULADO">Anulados</option>
                <option value="ELIMINADO">Eliminados</option>
              </select>
            </label>
            <label class="state-field">
              Entrega
              <select id="deliveryFilter">
                <option value="">Todos</option>
                <option value="PENDIENTE">Pendiente de entrega</option>
                <option value="ENTREGADO">Entregados</option>
              </select>
            </label>
          </div>
          <div class="toolbar-actions">
            <button class="secondary-button" id="refreshButton" type="button">Actualizar</button>
            <button class="secondary-button" id="downloadVisibleButton" type="button">Descargar QR visibles</button>
            <a class="secondary-button" id="printSheetLink" href="?print=1" target="_blank" rel="noopener">Descargar hoja de QR</a>
          </div>
        </section>

        <section class="card list-card">
          <div class="section-heading">
            <h2>Listado</h2>
          </div>

          <div class="bulk-bar">
            <label class="select-all" title="Seleccionar todos los cupones visibles">
              <input type="checkbox" id="selectAllCheckbox">
              <span>Seleccionar todos</span>
            </label>
            <div class="bulk-buttons">
              <button class="secondary-button" id="selectVisibleButton" type="button">Seleccionar visibles</button>
              <button class="secondary-button" id="deselectVisibleButton" type="button">Deseleccionar visibles</button>
              <button class="danger-button" id="deleteSelectedButton" type="button" disabled>Eliminar seleccionados</button>
            </div>
            <span id="selectedCount" class="selected-count">0 seleccionados</span>
          </div>
          <div id="bulkResult" class="inline-result"></div>

          <div id="couponList" class="coupon-list"></div>
        </section>
      </section>

      <dialog id="qrDialog" class="qr-dialog">
        <div class="dialog-header">
          <h2 id="dialogTitle">QR</h2>
          <button class="icon-button" type="button" onclick="closeQrDialog()" aria-label="Cerrar">×</button>
        </div>
        <div id="dialogQr" class="qr-preview"></div>
        <p id="dialogUrl" class="code-link"></p>
        <div id="dialogShare" class="button-row"></div>
      </dialog>
    </main>

    <!-- ========================================================================
         SCRIPT ADMIN AUTÓNOMO.
         Se ejecuta ANTES de incluir qr-lib.html. NO depende de shared.html ni de
         qr-lib.html para iniciar sesión: define aquí mismo escapeHtml y callServer,
         registra sus propios manejadores de error y cablea el login. Si qr-lib.html
         tiene un error, SOLO se pierde el render/descarga de QR; el panel carga igual.
         ===================================================================== -->
    <script>
      // ---- Helpers locales mínimos (sin dependencias externas) ----------------
      function escapeHtml(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      // Puente a las funciones del servidor (Promise). Definido localmente para que
      // el panel funcione aunque shared.html no esté cargado.
      function callServer(functionName) {
        var args = Array.prototype.slice.call(arguments, 1);
        return new Promise(function (resolve, reject) {
          var runner = google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(function (error) {
              reject(new Error(error && error.message ? error.message : String(error)));
            });
          runner[functionName].apply(runner, args);
        });
      }

      function debounce(fn, wait) {
        var timer = null;
        return function () {
          var ctx = this;
          var args = arguments;
          clearTimeout(timer);
          timer = setTimeout(function () { fn.apply(ctx, args); }, wait);
        };
      }

      // Nada queda silencioso: cualquier error JS o promesa rechazada se vuelve
      // VISIBLE en #loginError (fase login) o en #couponList (panel abierto).
      function showGlobalError(message) {
        var box = document.getElementById('loginError');
        var html = '<div class="notice error">' + escapeHtml(message) + '</div>';
        var content = document.getElementById('adminContent');
        if (content && !content.classList.contains('hidden')) {
          var list = document.getElementById('couponList');
          if (list) { list.innerHTML = html; return; }
        }
        if (box) box.innerHTML = html;
      }

      window.addEventListener('error', function (e) {
        console.error('JS error admin:', e.error || e.message);
        showGlobalError('Error JS: ' + ((e.error && e.error.message) || e.message || 'desconocido'));
      });
      window.addEventListener('unhandledrejection', function (e) {
        console.error('Promesa rechazada admin:', e.reason);
        showGlobalError('Error: ' + ((e.reason && e.reason.message) || String(e.reason)));
      });

      // ---- Estado del panel ----------------------------------------------------
      var branding = mergeBranding(<?!= JSON.stringify(branding || {}) ?>);
      // URL pública absoluta (/exec). Dentro del iframe sandbox de Apps Script los
      // enlaces relativos (?print=1, ?delivery=1) apuntan a userCodeAppPanel y abren
      // una pestaña vacía: por eso reescribimos los href con esta URL absoluta.
      var webAppUrl = <?!= JSON.stringify(webAppUrl || '') ?>;
      var adminPin = '';        // NUNCA en localStorage: solo vive en memoria.
      var coupons = [];
      var adminWired = false;   // evita cablear dos veces los controles del panel.

      // Reescribe los enlaces internos a la URL absoluta del Web App.
      function fixInternalLinks() {
        if (!webAppUrl) return;
        var map = [
          ['deliveryLink', '?delivery=1'],
          ['printLink', '?print=1'],
          ['printSheetLink', '?print=1']
        ];
        map.forEach(function (pair) {
          var el = document.getElementById(pair[0]);
          if (el) el.setAttribute('href', webAppUrl + pair[1]);
        });
      }
      fixInternalLinks();

      function mergeBranding(config) {
        config = config || {};
        return {
          businessName: config.businessName || 'Dulce Mezcla',
          instagramUrl: config.instagramUrl || '',
          whatsappUrl: config.whatsappUrl || '',
          logoUrl: config.logoUrl || '',
          logoDataUri: config.logoDataUri || ''
        };
      }

      // ---- LOGIN (prioridad absoluta) -----------------------------------------
      // Llamada DIRECTA a google.script.run para máxima transparencia. Muestra
      // "Validando PIN…" de inmediato al primer click/Enter.
      function loginAdmin(event) {
        if (event && event.preventDefault) event.preventDefault();
        var box = document.getElementById('loginError');
        var btn = document.getElementById('loginButton');
        var pin = (document.getElementById('adminPin').value || '').trim();

        // Realimentación VISIBLE e inmediata (regla: el primer click siempre
        // cambia #loginError a "Validando PIN…").
        if (box) box.innerHTML = '<div class="notice">Validando PIN…</div>';
        if (btn) btn.disabled = true;

        try {
          google.script.run
            .withSuccessHandler(function (result) {
              if (btn) btn.disabled = false;
              onLoginResult(pin, result);
            })
            .withFailureHandler(function (err) {
              if (btn) btn.disabled = false;
              if (box) box.innerHTML = '<div class="notice error">Error del servidor: ' +
                escapeHtml(err && err.message ? err.message : String(err)) + '</div>';
            })
            .getAdminDashboard(pin, { estado: '', busqueda: '' });
        } catch (err) {
          if (btn) btn.disabled = false;
          if (box) box.innerHTML = '<div class="notice error">Error JS: ' +
            escapeHtml(err && err.message ? err.message : String(err)) + '</div>';
        }
      }

      function onLoginResult(pin, result) {
        var box = document.getElementById('loginError');
        if (!result || !result.ok) {
          // Mantener login visible y mostrar el motivo.
          if (box) box.innerHTML = '<div class="notice error">' +
            escapeHtml((result && result.message) || 'PIN de administrador incorrecto.') + '</div>';
          return;
        }
        adminPin = pin;
        if (box) box.innerHTML = '';
        document.getElementById('loginPanel').classList.add('hidden');
        document.getElementById('adminContent').classList.remove('hidden');
        if (result.branding) {
          branding = mergeBranding(result.branding);
          renderAdminBrand();
        }
        applyDashboard(result);
        wireAdminUi();
      }

      // ---- Carga/refresco del dashboard (filtros, búsqueda, refrescar) --------
      function loadDashboard() {
        if (!adminPin) return;
        var list = document.getElementById('couponList');
        if (list) list.innerHTML = '<div class="loader">Cargando códigos…</div>';
        var filters = {
          estado: document.getElementById('stateFilter').value,
          busqueda: document.getElementById('searchBox').value,
          entrega: document.getElementById('deliveryFilter').value
        };
        callServer('getAdminDashboard', adminPin, filters)
          .then(function (result) {
            if (!result.ok) {
              if (list) list.innerHTML = '<div class="notice error">' + escapeHtml(result.message || 'Error') + '</div>';
              return;
            }
            applyDashboard(result);
          })
          .catch(function (err) {
            if (list) list.innerHTML = '<div class="notice error">' +
              escapeHtml(err && err.message ? err.message : String(err)) + '</div>';
          });
      }

      function applyDashboard(result) {
        coupons = result.coupons || [];
        renderSummary(result.summary || {});
        renderList(coupons);
      }

      // ---- Cableado del resto del panel (una sola vez, tras login) ------------
      function wireAdminUi() {
        if (adminWired) return;
        adminWired = true;
        try {
          renderAdminBrand();
          document.getElementById('generateForm').addEventListener('submit', generateBatch);
          document.getElementById('refreshButton').addEventListener('click', loadDashboard);
          document.getElementById('deleteSelectedButton').addEventListener('click', deleteSelectedCoupons);
          document.getElementById('downloadVisibleButton').addEventListener('click', downloadVisibleQrs);
          document.getElementById('stateFilter').addEventListener('change', loadDashboard);
          document.getElementById('deliveryFilter').addEventListener('change', loadDashboard);
          document.getElementById('searchBox').addEventListener('input', debounce(loadDashboard, 300));

          // Selección masiva: checkbox maestro, botones rápidos y delegación de
          // cambios sobre las casillas de cada cupón (el listado se re-renderiza).
          document.getElementById('selectAllCheckbox').addEventListener('change', function () {
            setAllVisible(this.checked);
          });
          document.getElementById('selectVisibleButton').addEventListener('click', function () {
            setAllVisible(true);
          });
          document.getElementById('deselectVisibleButton').addEventListener('click', function () {
            setAllVisible(false);
          });
          document.getElementById('couponList').addEventListener('change', function (event) {
            if (event.target && event.target.classList.contains('coupon-checkbox')) {
              updateSelectionUi();
            }
          });
          document.querySelectorAll('[data-batch]').forEach(function (button) {
            button.addEventListener('click', function () {
              document.getElementById('quantity').value = button.dataset.batch;
              document.getElementById('generateForm').requestSubmit();
            });
          });

          // Si qr-lib no está disponible, deshabilitar la descarga masiva de QR.
          if (!qrDownloadAvailable()) {
            var dl = document.getElementById('downloadVisibleButton');
            if (dl) { dl.disabled = true; dl.title = 'Descarga de QR no disponible en esta vista.'; }
          }
        } catch (err) {
          console.error('Error cableando el panel admin:', err);
          showGlobalError('Error inicializando el panel: ' + (err && err.message ? err.message : String(err)));
        }
      }

      // ---- Generar lote --------------------------------------------------------
      function generateBatch(event) {
        if (event && event.preventDefault) event.preventDefault();
        var resultBox = document.getElementById('generateResult');
        resultBox.innerHTML = '<div class="notice">Generando códigos…</div>';
        var payload = {
          pin: adminPin,
          cantidad: document.getElementById('quantity').value,
          prefijo: document.getElementById('prefix').value,
          promocion: document.getElementById('promotion').value,
          descripcion: document.getElementById('description').value
        };
        callServer('generateCoupons', payload)
          .then(function (result) {
            resultBox.innerHTML = '<div class="notice ' + (result.ok ? 'success' : 'error') + '">' +
              escapeHtml(result.message) + '</div>';
            if (result.ok) loadDashboard();
          })
          .catch(function (err) {
            resultBox.innerHTML = '<div class="notice error">' +
              escapeHtml(err && err.message ? err.message : String(err)) + '</div>';
          });
      }

      // ---- Render de resumen y listado ----------------------------------------
      function renderSummary(summary) {
        document.getElementById('summaryGrid').innerHTML =
          summaryCard('Total', summary.total) +
          summaryCard('Disponibles', summary.disponibles, 'available') +
          summaryCard('Redimidos', summary.redimidos, 'redeemed') +
          summaryCard('Pend. entrega', summary.pendientes_entrega, 'void') +
          summaryCard('Entregados', summary.entregados, 'available') +
          summaryCard('Anulados', summary.anulados, 'void') +
          summaryCard('Eliminados', summary.eliminados, 'deleted');
      }

      function summaryCard(label, value, tone) {
        return '<article class="summary-card ' + (tone || '') + '"><span>' + label +
          '</span><strong>' + (value || 0) + '</strong></article>';
      }

      function stateBadge(state) {
        var normalized = String(state || '').toLowerCase();
        return '<span class="state-badge ' + normalized + '">' + escapeHtml(state || 'SIN ESTADO') + '</span>';
      }

      // Badge de entrega: solo relevante para cupones REDIMIDOS.
      function deliveryBadge(coupon) {
        if (String(coupon.estado || '').toUpperCase() !== 'REDIMIDO') return '';
        var delivered = String(coupon.entrega_estado || '').toUpperCase() === 'ENTREGADO';
        return delivered
          ? '<span class="state-badge entregado">ENTREGADO</span>'
          : '<span class="state-badge pendiente-entrega">PENDIENTE ENTREGA</span>';
      }

      function renderList(items) {
        document.getElementById('listCount').textContent = items.length + ' resultado(s)';
        if (!items.length) {
          document.getElementById('couponList').innerHTML = '<div class="empty-state">No hay códigos con esos filtros.</div>';
          updateSelectionUi();
          return;
        }
        var showDownload = qrDownloadAvailable();
        document.getElementById('couponList').innerHTML = items.map(function (coupon) {
          var notDeleted = coupon.estado !== 'ELIMINADO';
          var c = escapeHtml(coupon.codigo);
          return '' +
            '<article class="coupon-row">' +
              '<label class="row-check" title="Seleccionar cupón">' +
                '<input type="checkbox" class="coupon-checkbox" value="' + c + '" ' + (notDeleted ? '' : 'disabled') + '>' +
              '</label>' +
              '<div>' +
                '<div class="row-title"><strong>' + c + '</strong> ' + stateBadge(coupon.estado) + ' ' + deliveryBadge(coupon) + '</div>' +
                '<p>' + escapeHtml(coupon.promocion || '') + '</p>' +
                '<small>' + escapeHtml(coupon.descripcion || '') + '</small>' +
                '<small>Creado: ' + escapeHtml(coupon.fecha_creacion || '-') +
                  (coupon.fecha_redencion ? ' · Redimido: ' + escapeHtml(coupon.fecha_redencion) : '') +
                  (coupon.fecha_entrega ? ' · Entregado: ' + escapeHtml(coupon.fecha_entrega) : '') + '</small>' +
              '</div>' +
              '<div class="row-actions">' +
                (notDeleted ? '<button class="secondary-button" type="button" onclick="showQr(\'' + c + '\')">Ver QR</button>' : '') +
                (notDeleted ? '<button class="secondary-button" type="button" onclick="copyCoupon(\'' + c + '\')">Copiar link</button>' : '') +
                (notDeleted && showDownload ? '<button class="secondary-button" type="button" onclick="downloadCouponQr(\'' + c + '\')">Descargar QR</button>' : '') +
                (coupon.estado === 'DISPONIBLE' ? '<button class="danger-button" type="button" onclick="changeStatus(\'' + c + '\',\'anular\')">Anular</button>' : '') +
                (coupon.estado === 'ANULADO' ? '<button class="primary-button" type="button" onclick="changeStatus(\'' + c + '\',\'reactivar\')">Reactivar</button>' : '') +
                (notDeleted ? '<button class="danger-button" type="button" onclick="deleteSingleCoupon(\'' + c + '\')">Eliminar</button>' : '') +
              '</div>' +
            '</article>';
        }).join('');

        // Cada render genera casillas nuevas sin marcar: reinicia contador,
        // botón de borrado y el checkbox maestro.
        updateSelectionUi();
      }

      // ---- Acciones por cupón --------------------------------------------------
      function changeStatus(code, action) {
        var label = action === 'anular' ? 'anular' : 'reactivar';
        if (!confirm('¿Seguro que quieres ' + label + ' ' + code + '?')) return;
        callServer('updateCouponStatus', { pin: adminPin, codigo: code, action: action })
          .then(function (result) {
            if (!result.ok) { alert(result.message); return; }
            loadDashboard();
          })
          .catch(function (err) { alert(err && err.message ? err.message : String(err)); });
      }

      function deleteSingleCoupon(code) {
        if (!confirm('¿Seguro que deseas eliminar este cupón? Esta acción lo marcará como ELIMINADO.')) return;
        callServer('deleteCoupon', code, adminPin)
          .then(function (result) {
            if (!result.ok) { alert(result.message); return; }
            loadDashboard();
          })
          .catch(function (err) { alert(err && err.message ? err.message : String(err)); });
      }

      // ---- Selección masiva ----------------------------------------------------
      // Marca/desmarca todas las casillas VISIBLES y habilitadas (los cupones
      // ELIMINADO tienen la casilla deshabilitada y nunca se seleccionan).
      function setAllVisible(checked) {
        var boxes = document.querySelectorAll('.coupon-checkbox:not([disabled])');
        for (var i = 0; i < boxes.length; i++) boxes[i].checked = checked;
        updateSelectionUi();
      }

      // Sincroniza contador, botón "Eliminar seleccionados" y el checkbox maestro
      // (incluye estado indeterminado). Se llama tras cada cambio y tras renderList.
      function updateSelectionUi() {
        var selectable = document.querySelectorAll('.coupon-checkbox:not([disabled])');
        var selected = document.querySelectorAll('.coupon-checkbox:checked');
        var total = selectable.length;
        var count = selected.length;

        var counter = document.getElementById('selectedCount');
        if (counter) {
          counter.textContent = count + ' seleccionado' + (count === 1 ? '' : 's');
          counter.classList.toggle('has-selection', count > 0);
        }

        var delBtn = document.getElementById('deleteSelectedButton');
        if (delBtn) delBtn.disabled = count === 0;

        var master = document.getElementById('selectAllCheckbox');
        if (master) {
          master.checked = total > 0 && count === total;
          master.indeterminate = count > 0 && count < total;
          master.disabled = total === 0;
        }
      }

      function showBulkResult(message, tone) {
        var box = document.getElementById('bulkResult');
        if (!box) return;
        box.innerHTML = message
          ? '<div class="notice ' + (tone || '') + '">' + escapeHtml(message) + '</div>'
          : '';
      }

      function deleteSelectedCoupons() {
        var selected = Array.prototype.slice.call(document.querySelectorAll('.coupon-checkbox:checked'))
          .map(function (input) { return input.value; });
        if (!selected.length) { showBulkResult('Selecciona al menos un cupón.', 'error'); return; }

        var plural = selected.length === 1 ? '' : 'es';
        if (!confirm('Vas a marcar como ELIMINADO ' + selected.length + ' cupón' + plural +
          '. ¿Deseas continuar?')) return;

        var delBtn = document.getElementById('deleteSelectedButton');
        if (delBtn) delBtn.disabled = true;
        showBulkResult('Eliminando ' + selected.length + ' cupón' + plural + '…', '');

        callServer('deleteCouponsBulk', selected, adminPin)
          .then(function (result) {
            if (!result.ok) { showBulkResult(result.message || 'No se pudo eliminar.', 'error'); return; }
            // Actualiza el resumen superior de inmediato; loadDashboard re-renderiza
            // el listado (lo que limpia la selección y reinicia el contador).
            if (result.summary) renderSummary(result.summary);
            showBulkResult('Listo: ' + (result.updated || selected.length) + ' cupón' + plural +
              ' marcados como ELIMINADO.', 'success');
            loadDashboard();
          })
          .catch(function (err) { showBulkResult(err && err.message ? err.message : String(err), 'error'); });
      }

      function findCoupon(code) {
        return coupons.filter(function (coupon) { return coupon.codigo === code; })[0];
      }

      // ---- QR (degrada con gracia si qr-lib.html no cargó) --------------------
      function qrRenderAvailable() { return typeof renderQr === 'function'; }
      function qrDownloadAvailable() { return typeof downloadQrSvg === 'function'; }

      function showQr(code) {
        var coupon = findCoupon(code);
        if (!coupon) return;
        document.getElementById('dialogTitle').textContent = coupon.codigo;
        document.getElementById('dialogUrl').textContent = coupon.url_redencion;
        document.getElementById('dialogShare').innerHTML = renderShareButtons(coupon);
        var qrBox = document.getElementById('dialogQr');
        if (qrRenderAvailable()) {
          renderQr(qrBox, coupon.url_redencion, { size: 240 });
        } else {
          qrBox.innerHTML = '<div class="notice">QR no disponible en esta vista.</div>';
        }
        if (qrDownloadAvailable()) {
          document.getElementById('dialogShare').insertAdjacentHTML(
            'beforeend',
            '<button class="secondary-button" type="button" onclick="downloadCouponQr(\'' + escapeHtml(coupon.codigo) + '\')">Descargar QR</button>'
          );
        }
        document.getElementById('qrDialog').showModal();
      }

      function closeQrDialog() {
        document.getElementById('qrDialog').close();
      }

      function copyCoupon(code) {
        var coupon = findCoupon(code);
        if (!coupon) return;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(coupon.url_redencion).then(function () { alert('Enlace copiado.'); });
        } else {
          window.prompt('Copia el enlace:', coupon.url_redencion);
        }
      }

      function downloadCouponQr(code) {
        var coupon = findCoupon(code);
        if (!coupon) return;
        if (!qrDownloadAvailable()) { alert('La descarga de QR no está disponible en esta vista.'); return; }
        downloadQrSvg(coupon.url_redencion, 'QR-' + coupon.codigo + '.svg', 512);
      }

      function downloadVisibleQrs() {
        if (!qrDownloadAvailable()) { alert('La descarga de QR no está disponible en esta vista.'); return; }
        var downloadable = coupons.filter(function (coupon) { return coupon.estado !== 'ELIMINADO'; });
        if (!downloadable.length) { alert('No hay QR visibles para descargar.'); return; }
        if (downloadable.length > 50 && !confirm('Vas a descargar ' + downloadable.length + ' archivos SVG. El navegador puede pedir confirmación. ¿Continuar?')) {
          return;
        }
        downloadable.forEach(function (coupon, index) {
          setTimeout(function () { downloadQrSvg(coupon.url_redencion, 'QR-' + coupon.codigo + '.svg', 512); }, index * 120);
        });
      }

      // ---- Compartir (autónomo, sin shared.html) ------------------------------
      function shareTextFor(coupon) {
        return (coupon.promocion || 'Cupón de descuento') + '\nCódigo: ' + coupon.codigo + '\nLink: ' + coupon.url_redencion;
      }

      function renderShareButtons(coupon) {
        var encodedText = encodeURIComponent(shareTextFor(coupon));
        var encodedUrl = encodeURIComponent(coupon.url_redencion || '');
        var subject = encodeURIComponent('Tu cupón de descuento');
        return '' +
          '<button class="action-pill" type="button" onclick="shareCoupon(\'' + escapeHtml(coupon.codigo) + '\')"><span>Compartir</span></button>' +
          '<a class="action-pill" href="mailto:?subject=' + subject + '&body=' + encodedText + '"><span>Correo</span></a>' +
          '<a class="action-pill" target="_blank" rel="noopener" href="https://t.me/share/url?url=' + encodedUrl + '&text=' + encodedText + '"><span>Telegram</span></a>';
      }

      function shareCoupon(code) {
        var coupon = findCoupon(code);
        if (!coupon) return;
        if (navigator.share) {
          navigator.share({ title: coupon.promocion || 'Cupón de descuento', text: shareTextFor(coupon), url: coupon.url_redencion });
        } else if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(shareTextFor(coupon)).then(function () { alert('Texto copiado para compartir.'); });
        } else {
          window.prompt('Copia para compartir:', shareTextFor(coupon));
        }
      }

      // ---- Marca ---------------------------------------------------------------
      function renderAdminBrand() {
        var src = branding.logoUrl || branding.logoDataUri || '';
        var name = escapeHtml(branding.businessName || 'Dulce Mezcla');
        var logo = src
          ? '<img class="brand-logo tiny" src="' + escapeHtml(src) + '" alt="' + name + '">'
          : '<div class="brand-logo tiny text-logo" aria-label="' + name + '">DM</div>';
        var el = document.getElementById('adminBrand');
        if (el) el.innerHTML = logo + '<span>' + name + '</span>';
      }

      // Marca inicial visible desde el primer render (antes del login).
      renderAdminBrand();
    </script>

    <!-- qr-lib.html va DESPUÉS y es OPCIONAL: provee renderQr/downloadQrSvg.
         Si falla, el login y el panel siguen funcionando (descarga deshabilitada). -->
    <?!= include('qr-lib'); ?>
