<script>
  // ============================================================================
  // shared.html — Librería base SIN dependencia del QR.
  // Se incluye ANTES que qr-lib.html en todas las páginas.
  // Aquí viven los helpers que el login admin necesita (callServer, escapeHtml,
  // normalizeBranding, safeStorage*, debounce, etc.). Si el encoder QR falla,
  // estos helpers SIGUEN definidos porque están en otro <script> aparte.
  // ============================================================================
  function callServer(functionName, ...args) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler((error) => reject(new Error(error && error.message ? error.message : String(error))))
        [functionName](...args);
    });
  }

  // El Web App de Apps Script corre en un iframe sandbox (googleusercontent.com).
  // Si el navegador bloquea almacenamiento de terceros, localStorage LANZA SecurityError.
  // Sin estos wrappers, ese throw mata el <script> antes de registrar los listeners
  // y el botón "Entrar" del admin queda mudo. Nunca acceder a localStorage directo.
  function safeStorageGet(key) {
    try {
      return (window.localStorage && window.localStorage.getItem(key)) || '';
    } catch (err) {
      console.error('localStorage no disponible (sandbox):', err);
      return '';
    }
  }

  function safeStorageSet(key, value) {
    try {
      if (window.localStorage) window.localStorage.setItem(key, value);
    } catch (err) {
      console.error('localStorage no disponible (sandbox):', err);
    }
  }

  function escapeHtml(value) {
    return String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function setLoading(element, text) {
    element.innerHTML = `<div class="loader">${escapeHtml(text || 'Cargando...')}</div>`;
  }

  function renderMessage(type, title, body) {
    return `<div class="message ${escapeHtml(type)}"><h2>${escapeHtml(title)}</h2><p>${escapeHtml(body)}</p></div>`;
  }

  function stateBadge(state) {
    const normalized = String(state || '').toLowerCase();
    const meta = getCouponStatusMeta(state);
    return `<span class="state-badge ${normalized}">${iconSvg(meta.icon)}${escapeHtml(state || 'SIN ESTADO')}</span>`;
  }

  function renderShareButtons(coupon) {
    const encodedText = encodeURIComponent(shareText(coupon));
    const encodedUrl = encodeURIComponent(coupon.url_redencion || '');
    const subject = encodeURIComponent('Tu cupón de descuento');
    return `
      <button class="action-pill" type="button" onclick="shareNative('${escapeHtml(coupon.codigo)}')">${iconSvg('share')}<span>Compartir</span></button>
      <a class="action-pill" href="mailto:?subject=${subject}&body=${encodedText}">${iconSvg('mail')}<span>Correo</span></a>
      <a class="action-pill" target="_blank" rel="noopener" href="https://t.me/share/url?url=${encodedUrl}&text=${encodedText}">${iconSvg('telegram')}<span>Telegram</span></a>`;
  }

  function normalizeBranding(config = {}) {
    return {
      businessName: config.businessName || 'Dulce Mezcla',
      instagramUrl: config.instagramUrl || 'https://www.instagram.com/dulcemezcla.reposteria/',
      whatsappUrl: config.whatsappUrl || 'https://api.whatsapp.com/send?phone=573143495267&text=Quiero%20preguntar%20por%20tus%20deliciosas%20tortas%20%F0%9F%92%96',
      logoUrl: config.logoUrl || '',
      logoDataUri: config.logoDataUri || ''
    };
  }

  function brandLogoHtml(config, size = 'small') {
    const name = escapeHtml((config && config.businessName) || 'Dulce Mezcla');
    // Preferimos LOGO_URL externo si se configuró; si no, el logo embebido (base64);
    // si ambos fallan, el monograma DM. El onerror cae al monograma sin romper el layout.
    const src = (config && config.logoUrl) || (config && config.logoDataUri) || '';
    if (src) {
      return `<img class="brand-logo ${escapeHtml(size)}" src="${escapeHtml(src)}" alt="${name}" onerror="this.replaceWith(createLogoFallback('${escapeHtml(size)}'))">`;
    }
    return logoFallbackHtml(size, name);
  }

  function logoFallbackHtml(size = 'small', label = 'Dulce Mezcla') {
    return `<div class="brand-logo ${escapeHtml(size)} text-logo" aria-label="${escapeHtml(label)}">DM</div>`;
  }

  function createLogoFallback(size = 'small') {
    const fallback = document.createElement('div');
    fallback.className = `brand-logo ${size} text-logo`;
    fallback.setAttribute('aria-label', 'Dulce Mezcla');
    fallback.textContent = 'DM';
    return fallback;
  }

  function brandExternalLink(label, url) {
    if (!url) return '';
    const icon = label === 'Instagram' ? 'instagram' : 'whatsapp';
    return `<a class="action-pill brand-link ${escapeHtml(icon)}" target="_blank" rel="noopener" href="${escapeHtml(url)}">${iconSvg(icon)}<span>${escapeHtml(label)}</span></a>`;
  }

  function getCouponStatusMeta(state) {
    const normalized = String(state || '').toUpperCase();
    if (normalized === 'DISPONIBLE') {
      return {
        icon: 'check',
        title: 'Cupón válido',
        message: 'Listo para redimir en Dulce Mezcla.'
      };
    }
    if (normalized === 'REDIMIDO') {
      return {
        icon: 'used',
        title: 'Cupón redimido',
        message: 'Preséntalo en el stand de Dulce Mezcla para reclamar tu beneficio.'
      };
    }
    return {
      icon: 'alert',
      title: 'Este cupón no está disponible',
      message: 'Consulta con Dulce Mezcla si tienes dudas sobre este cupón.'
    };
  }

  function buildCouponWhatsAppMessage(coupon, config = {}) {
    const businessName = config.businessName || 'Dulce Mezcla';
    const promo = coupon.promocion ? ` de la promoción "${coupon.promocion}"` : '';
    return `Hola, redimí el cupón ${coupon.codigo}${promo} de ${businessName} y quiero saber en qué consiste la promoción o qué obtengo con este cupón 💖`;
  }

  function buildCouponWhatsAppUrl(coupon, config = {}) {
    const base = config.whatsappUrl || 'https://api.whatsapp.com/send?phone=573143495267';
    const phoneMatch = String(base).match(/[?&]phone=([^&]+)/);
    const phone = phoneMatch ? phoneMatch[1] : '573143495267';
    return `https://api.whatsapp.com/send?phone=${encodeURIComponent(phone)}&text=${encodeURIComponent(buildCouponWhatsAppMessage(coupon, config))}`;
  }

  function iconSvg(name) {
    const icons = {
      instagram: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="1"></circle></svg>',
      whatsapp: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.2 19.1 6 15.8a7.5 7.5 0 1 1 2.9 2.8l-3.7.5Z"></path><path d="M9.3 8.8c.2-.5.4-.5.7-.5h.5c.2 0 .4.1.5.4l.7 1.6c.1.3.1.5-.1.7l-.4.5c-.1.1-.2.3-.1.5.4.8 1.2 1.7 2.2 2.2.2.1.4.1.5-.1l.6-.7c.2-.2.4-.2.7-.1l1.5.7c.3.1.4.3.4.6 0 .8-.7 1.5-1.5 1.6-1.1.2-2.8-.4-4.4-2-1.6-1.6-2.4-3.4-2.2-4.5 0-.3.1-.6.3-.9Z"></path></svg>',
      mail: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="13" rx="2"></rect><path d="m4.5 7 7.5 6 7.5-6"></path></svg>',
      telegram: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 4-4 16-5.5-5-3.5 3v-5L3 11l18-7Z"></path><path d="m8 13 8-5"></path></svg>',
      share: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="m8.6 10.6 6.8-4.2M8.6 13.4l6.8 4.2"></path></svg>',
      gift: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11h16v9H4z"></path><path d="M3 7h18v4H3zM12 7v13"></path><path d="M12 7H8.5a2 2 0 1 1 2-2c0 2-2.5 2-2.5 2M12 7h3.5a2 2 0 1 0-2-2c0 2 2.5 2 2.5 2"></path></svg>',
      check: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m8 12 2.5 2.5L16 9"></path></svg>',
      used: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m9 9 6 6M15 9l-6 6"></path></svg>',
      alert: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2.8 19h18.4L12 3Z"></path><path d="M12 9v4M12 17h.01"></path></svg>'
    };
    return icons[name] || '';
  }

  function shareText(coupon) {
    return `${coupon.promocion || 'Cupón de descuento'}\nCódigo: ${coupon.codigo}\nLink: ${coupon.url_redencion}`;
  }

  async function shareNative(code) {
    const source = typeof coupons !== 'undefined' ? coupons : currentCoupon ? [currentCoupon] : [];
    const coupon = Array.isArray(source) ? source.find((item) => item.codigo === code) : source;
    if (!coupon) return;
    if (navigator.share) {
      await navigator.share({
        title: coupon.promocion || 'Cupón de descuento',
        text: shareText(coupon),
        url: coupon.url_redencion
      });
    } else {
      await navigator.clipboard.writeText(shareText(coupon));
      alert('Texto copiado para compartir.');
    }
  }

  function debounce(fn, wait) {
    let timer = null;
    return (...args) => {
      clearTimeout(timer);
      timer = setTimeout(() => fn(...args), wait);
    };
  }
</script>
